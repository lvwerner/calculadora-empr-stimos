spring.application.name=calculadora

# Desempenho
spring.threads.virtual.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=2KB

# Segurança: sem detalhes internos nas respostas de erro e requisições pequenas
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.max-http-request-header-size=8KB
server.tomcat.max-swallow-size=64KB
server.tomcat.max-http-form-post-size=16KB
server.server-header=
